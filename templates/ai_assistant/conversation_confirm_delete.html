{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;">
  <h2>Delete conversation?</h2>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'ai_assistant:conversation_list' %}" class="btn">Cancel</a>
  </form>
</div>
{% endblock %}
