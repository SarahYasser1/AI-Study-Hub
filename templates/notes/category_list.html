{% extends "base.html" %}
{% block content %}
<h2>Categories</h2>
<div class="grid grid-2">
  <div class="card">
    <h3>Add category</h3>
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
      <div class="form-group">
        <label>{{ field.label }}</label>
        {{ field }}
      </div>
      {% endfor %}
      <button type="submit" class="btn btn-primary">Add</button>
    </form>
  </div>
  <div class="card">
    <h3>Your categories</h3>
    {% for c in categories %}
    <div style="display:flex;justify-content:space-between;align-items:center;padding:.4rem 0;border-bottom:1px solid var(--border);">
      <span class="badge" style="background:{{ c.color }};color:#fff;">{{ c.name }}</span>
      <form method="post" action="{% url 'notes:category_delete' c.pk %}">
        {% csrf_token %}
        <button class="btn btn-sm btn-danger" type="submit">Delete</button>
      </form>
    </div>
    {% empty %}
    <p class="empty-state">No categories yet.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
