{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;">
  <h2>Delete note?</h2>
  <p>Are you sure you want to delete "<strong>{{ note.title }}</strong>"?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'notes:note_list' %}" class="btn">Cancel</a>
  </form>
</div>
{% endblock %}
