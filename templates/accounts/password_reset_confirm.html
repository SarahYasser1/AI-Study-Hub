{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;">
  <h2>Set a new password</h2>
  {% if validlink %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Set password</button>
  </form>
  {% else %}
  <p>This reset link is invalid or has expired.</p>
  {% endif %}
</div>
{% endblock %}
