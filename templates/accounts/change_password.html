{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;">
  <h2>Change Password</h2>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="form-group">
      <label>{{ field.label }}</label>
      {{ field }}
      {{ field.errors }}
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Update password</button>
  </form>
</div>
{% endblock %}
